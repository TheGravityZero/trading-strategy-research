[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidation-cascades"
version = "0.1.0"
description = "Open-data prototype for crypto liquidation-cascade proxy signals"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.scripts]
cascades = "cascades.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

