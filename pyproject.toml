[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-research"
version = "0.1.0"
description = "Reproducible trading-strategy research for crypto and US equities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.scripts]
trading-strategy = "trading_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
